<script>
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Minimal markdown -> HTML
function renderMarkdown(md){
  const lines = md.split('\n');
  let html = '';
  let inList = null; // 'ul' | 'ol'
  let inQuote = false;

  function closeList(){
    if(inList){ html += inList === 'ul' ? '</ul>' : '</ol>'; inList = null; }
  }
  function closeQuote(){
    if(inQuote){ html += '</blockquote>'; inQuote = false; }
  }
  function inline(text){
    text = escapeHtml(text);
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    return text;
  }

  for(let raw of lines){
    const line = raw.trim();
    if(line === ''){ closeList(); closeQuote(); continue; }

    let m;
    if((m = line.match(/^###\s+(.*)/))){ closeList(); closeQuote(); html += `<h3>${inline(m[1])}</h3>`; continue; }
    if((m = line.match(/^##\s+(.*)/))){ closeList(); closeQuote(); html += `<h2>${inline(m[1])}</h2>`; continue; }
    if((m = line.match(/^#\s+(.*)/))){ closeList(); closeQuote(); html += `<h1>${inline(m[1])}</h1>`; continue; }
    if((m = line.match(/^>\s?(.*)/))){ closeList(); if(!inQuote){ html += '<blockquote>'; inQuote = true; } html += `<p>${inline(m[1])}</p>`; continue; }
    if((m = line.match(/^[-*]\s+(.*)/))){ closeQuote(); if(inList !== 'ul'){ closeList(); html += '<ul>'; inList = 'ul'; } html += `<li>${inline(m[1])}</li>`; continue; }
    if((m = line.match(/^\d+\.\s+(.*)/))){ closeQuote(); if(inList !== 'ol'){ closeList(); html += '<ol>'; inList = 'ol'; } html += `<li>${inline(m[1])}</li>`; continue; }

    closeList(); closeQuote();
    html += `<p>${inline(line)}</p>`;
  }
  closeList(); closeQuote();
  return html;
}

let lastDraftText = '';

async function generateDraft(){
  const topic = document.getElementById('topic').value.trim();
  const audience = document.getElementById('audience').value;
  const tone = document.getElementById('tone').value;
  const focus = document.getElementById('focus').value;
  const outputBody = document.getElementById('outputBody');
  const wordCount = document.getElementById('wordCount');
  const btn = document.getElementById('genBtn');

  if(!topic){
    outputBody.innerHTML = `<div class="error-box">Add a roadmap topic in field 01 before drafting.</div>`;
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Drafting…';
  wordCount.textContent = '';
  outputBody.innerHTML = `
    <div class="loading-wrap">
      <svg class="compass" viewBox="0 0 54 54" fill="none">
        <circle cx="27" cy="27" r="24" stroke="#2D5478" stroke-width="2"/>
        <path d="M27 6 L27 48 M6 27 L48 27" stroke="#2D5478" stroke-width="1"/>
        <path d="M27 27 L40 14" stroke="#FFC857" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="27" cy="27" r="3" fill="#FFC857"/>
      </svg>
      <div class="loading-text mono">Plotting the draft…</div>
    </div>`;

  try{
    const response = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic, audience, tone, focus })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || `Request failed (${response.status})`);
    }

    lastDraftText = data.draft;
    const words = data.word_count || lastDraftText.split(/\s+/).filter(Boolean).length;
    wordCount.textContent = `${words} WORDS`;

    outputBody.innerHTML = `
      <div class="draft">${renderMarkdown(lastDraftText)}</div>
      <div class="toolbar">
        <button class="tool-btn mono" onclick="copyDraft()">Copy Markdown</button>
        <button class="tool-btn mono" onclick="downloadDraft()">Download .md</button>
      </div>`;

  } catch(err){
    outputBody.innerHTML = `<div class="error-box">Draft failed: ${escapeHtml(err.message)}. Try again.</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Draft →';
  }
}

function copyDraft(){
  if(!lastDraftText) return;
  navigator.clipboard.writeText(lastDraftText);
}

function downloadDraft(){
  if(!lastDraftText) return;
  const blob = new Blob([lastDraftText], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'roadmap-blog-draft.md';
  a.click();
  URL.revokeObjectURL(url);
}
</script>

</body>
</html> -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compose</title>
<style>
  :root{
    --bg: #0B0B1A;
    --violet: #7C5CFC;
    --coral: #FF6B6B;
    --cyan: #4ADEDE;
    --surface: rgba(255,255,255,0.055);
    --surface-strong: rgba(255,255,255,0.09);
    --border: rgba(255,255,255,0.12);
    --text: #F5F3FF;
    --text-muted: #9C97BE;
    --text-dim: #6E698F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
    color: var(--text);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    padding: 64px 20px 80px 20px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  .display{ font-family:'Bricolage Grotesque', sans-serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  /* Ambient gradient mesh */
  .blob{ position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.5; z-index: 0; pointer-events:none; }
  .blob-1{ width: 480px; height: 480px; background: var(--violet); top: -160px; left: -120px; animation: drift1 22s ease-in-out infinite; }
  .blob-2{ width: 420px; height: 420px; background: var(--coral); bottom: -140px; right: -100px; animation: drift2 26s ease-in-out infinite; }
  .blob-3{ width: 320px; height: 320px; background: var(--cyan); top: 30%; right: 8%; opacity: 0.28; animation: drift3 30s ease-in-out infinite; }
  @keyframes drift1{ 0%,100%{ transform: translate(0,0); } 50%{ transform: translate(60px, 50px); } }
  @keyframes drift2{ 0%,100%{ transform: translate(0,0); } 50%{ transform: translate(-50px,-40px); } }
  @keyframes drift3{ 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(-40px,30px) scale(1.08); } }
  @media (prefers-reduced-motion: reduce){ .blob{ animation: none; } }

  .wrap{ max-width: 780px; margin: 0 auto; position: relative; z-index: 1; }

  .masthead{ text-align:center; margin-bottom: 46px; }
  .badge{
    display:inline-flex; align-items:center; gap:7px; font-family:'JetBrains Mono', monospace;
    font-size: 11.5px; letter-spacing: 0.08em; text-transform:uppercase; color: var(--cyan);
    background: rgba(74,222,222,0.08); border: 1px solid rgba(74,222,222,0.25);
    padding: 6px 14px; border-radius: 999px; margin-bottom: 20px;
  }
  .badge-dot{ width:6px; height:6px; border-radius:50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }

  .masthead h1{
    font-size: 52px; font-weight: 700; margin: 0 0 12px 0; line-height:1.05;
    background: linear-gradient(120deg, #FFFFFF 20%, var(--violet) 65%, var(--coral) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .masthead p{ font-size: 16.5px; color: var(--text-muted); margin: 0; }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 26px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    padding: 34px 36px;
    margin-bottom: 26px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  }

  .field{ margin-bottom: 24px; }
  .field-label{
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 11px; display:block;
  }

  textarea{
    width: 100%; background: rgba(255,255,255,0.04); border: 1.5px solid var(--border);
    border-radius: 16px; padding: 15px 18px; color: var(--text); font-size: 15.5px;
    font-family: 'Plus Jakarta Sans', sans-serif; outline: none; resize: vertical; min-height: 66px;
    line-height: 1.5; transition: border-color .15s ease, background .15s ease;
  }
  textarea:focus{ border-color: var(--violet); background: rgba(124,92,252,0.06); }
  textarea::placeholder{ color: var(--text-dim); }

  .suggestions{ display:flex; flex-wrap:wrap; gap:8px; margin-top: 10px; }
  .suggestion-chip{
    background: transparent; border: 1px dashed var(--border); color: var(--text-dim);
    font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor:pointer;
    font-family: 'Plus Jakarta Sans', sans-serif; transition: all .15s ease;
  }
  .suggestion-chip:hover{ border-color: var(--cyan); color: var(--cyan); border-style: solid; }

  .chip-row{ display:flex; flex-wrap: wrap; gap: 9px; }
  .chip{
    background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text-muted);
    font-size: 13.5px; font-weight: 500; padding: 9px 17px; border-radius: 999px; cursor:pointer;
    font-family: 'Plus Jakarta Sans', sans-serif; transition: all .15s ease;
  }
  .chip:hover{ border-color: rgba(124,92,252,0.5); color: var(--text); }
  .chip.active{
    background: linear-gradient(120deg, var(--violet), var(--coral));
    border-color: transparent; color: #fff;
  }

  .cta-row{ display:flex; justify-content:center; margin-top: 32px; }
  .cta-btn{
    display:inline-flex; align-items:center; gap: 10px;
    background: linear-gradient(120deg, var(--violet), var(--coral));
    color: #fff; border: none; border-radius: 999px;
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 16px;
    padding: 15px 34px; cursor: pointer;
    box-shadow: 0 8px 30px rgba(124,92,252,0.35);
    transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .cta-btn:hover:not(:disabled){ transform: translateY(-2px); box-shadow: 0 12px 36px rgba(124,92,252,0.45); }
  .cta-btn:active:not(:disabled){ transform: translateY(0px); }
  .cta-btn:disabled{ opacity: 0.6; cursor: default; transform:none; }
  .cta-btn svg{ width: 18px; height: 18px; }

  /* Output */
  .result-card{ display:none; }
  .result-card.visible{ display:block; animation: riseIn .5s ease; }
  @keyframes riseIn{ from{ opacity:0; transform: translateY(14px); } to{ opacity:1; transform:translateY(0); } }

  .result-meta{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--border);
  }
  .result-meta .tag{
    font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--cyan);
    background: rgba(74,222,222,0.08); border: 1px solid rgba(74,222,222,0.2);
    padding: 5px 12px; border-radius: 999px;
  }
  .result-meta .wc{ font-family:'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); }

  .draft{ color: var(--text); line-height: 1.8; font-size: 16px; }
  .draft h1{ font-family:'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight:700; margin: 0 0 16px 0;
    background: linear-gradient(120deg, #FFFFFF, var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .draft h2{ font-family:'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight:600; margin-top: 1.5em; color: var(--coral); }
  .draft h3{ font-family:'Bricolage Grotesque', sans-serif; font-size: 16.5px; font-weight:600; margin-top: 1.2em; color: var(--text); }
  .draft p{ margin: 1em 0; color: #E4E1F5; }
  .draft strong{ color: #fff; }
  .draft ul, .draft ol{ padding-left: 22px; color: #E4E1F5; }
  .draft blockquote{ border-left: 3px solid var(--violet); margin: 1.2em 0; padding: 4px 18px; color: var(--text-muted); font-style: italic; }

  .toolbar{ display:flex; gap:10px; margin-top: 24px; padding-top:20px; border-top: 1px solid var(--border); }
  .tool-btn{
    background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 9px 18px; font-size: 13px; font-family: 'Plus Jakarta Sans', sans-serif;
    cursor:pointer; font-weight:500; transition: all .15s ease;
  }
  .tool-btn:hover{ border-color: var(--violet); background: rgba(124,92,252,0.1); }

  /* Loading */
  .loading-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 46px 10px; gap: 18px;
  }
  .orb{
    width: 54px; height: 54px; border-radius: 50%;
    background: linear-gradient(135deg, var(--violet), var(--coral), var(--cyan));
    background-size: 200% 200%;
    animation: orbPulse 1.4s ease-in-out infinite, orbShift 3s ease infinite;
  }
  @keyframes orbPulse{ 0%,100%{ transform: scale(1); opacity:1; } 50%{ transform: scale(1.15); opacity:0.75; } }
  @keyframes orbShift{ 0%{ background-position: 0% 50%; } 50%{ background-position: 100% 50%; } 100%{ background-position: 0% 50%; } }
  .loading-text{ font-family:'JetBrains Mono', monospace; font-size: 13px; color: var(--text-muted); }
  .loading-text .dots::after{ content:'...'; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots{ 0%{ content:''; } 25%{ content:'.'; } 50%{ content:'..'; } 75%{ content:'...'; } 100%{ content:''; } }

  .error-note{
    border: 1px solid rgba(255,107,107,0.4); background: rgba(255,107,107,0.08); color: #FFB4B4;
    padding: 15px 18px; border-radius: 14px; font-size: 14px;
  }

  footer{
    text-align:center; margin-top: 8px; font-size: 12px; color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="wrap">

  <div class="masthead">
    <!-- <span class="badge"><span class="badge-dot"></span>AI-drafted, human-ready</span> -->
    <h1 class="display">Compose</h1>
    <p>Give it a topic. Get a full blog post back in seconds.</p>
  </div>

  <div class="card">
    <div class="field">
      <span class="field-label">Topic</span>
      <textarea id="topic" placeholder="e.g. why I stopped using to-do list apps"></textarea>
      <div class="suggestions">
        <button class="suggestion-chip" onclick="fillTopic('why remote work broke my sleep schedule')">remote work &amp; sleep</button>
        <button class="suggestion-chip" onclick="fillTopic('what my worst hire taught me about interviewing')">a hiring mistake</button>
        <button class="suggestion-chip" onclick="fillTopic('the case for boring technology')">boring tech</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label">Angle</span>
      <div class="chip-row" id="angleGroup">
        <button class="chip active" data-value="an explainer that unpacks a concept">Explainer</button>
        <button class="chip" data-value="a practical how-to guide">How-to</button>
        <button class="chip" data-value="a personal essay or story">Personal essay</button>
        <button class="chip" data-value="an opinion piece or hot take">Hot take</button>
        <button class="chip" data-value="an industry analysis">Analysis</button>
      </div>
    </div>

    <div class="field" style="margin-bottom:0;">
      <span class="field-label">Voice</span>
      <div class="chip-row" id="toneGroup">
        <button class="chip active" data-value="warm and personal">Warm</button>
        <button class="chip" data-value="sharp and analytical">Sharp</button>
        <button class="chip" data-value="playful and witty">Playful</button>
        <button class="chip" data-value="authoritative and expert">Authoritative</button>
        <button class="chip" data-value="conversational and grounded">Conversational</button>
      </div>
    </div>

    <div class="cta-row">
      <button class="cta-btn" id="genBtn" onclick="generateBlog()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        <span id="genBtnText">Generate post</span>
      </button>
    </div>
  </div>

  <div class="card result-card" id="resultCard">
    <div id="outputArea"></div>
  </div>

  <footer>drafts are a starting point — give them a read before you hit publish</footer>
</div>

<script>
let lastDraft = '';
let angleValue = document.querySelector('#angleGroup .chip.active').dataset.value;
let toneValue = document.querySelector('#toneGroup .chip.active').dataset.value;

document.querySelectorAll('#angleGroup .chip').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#angleGroup .chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    angleValue = btn.dataset.value;
  });
});
document.querySelectorAll('#toneGroup .chip').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#toneGroup .chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    toneValue = btn.dataset.value;
  });
});

function fillTopic(text){
  document.getElementById('topic').value = text;
  document.getElementById('topic').focus();
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(md){
  const lines = md.split('\n');
  let html = '';
  let inList = null;
  let inQuote = false;

  function closeList(){ if(inList){ html += inList === 'ul' ? '</ul>' : '</ol>'; inList = null; } }
  function closeQuote(){ if(inQuote){ html += '</blockquote>'; inQuote = false; } }
  function inline(text){
    text = escapeHtml(text);
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    return text;
  }

  for(let raw of lines){
    const line = raw.trim();
    if(line === ''){ closeList(); closeQuote(); continue; }
    let m;
    if((m = line.match(/^###\s+(.*)/))){ closeList(); closeQuote(); html += `<h3>${inline(m[1])}</h3>`; continue; }
    if((m = line.match(/^##\s+(.*)/))){ closeList(); closeQuote(); html += `<h2>${inline(m[1])}</h2>`; continue; }
    if((m = line.match(/^#\s+(.*)/))){ closeList(); closeQuote(); html += `<h1>${inline(m[1])}</h1>`; continue; }
    if((m = line.match(/^>\s?(.*)/))){ closeList(); if(!inQuote){ html += '<blockquote>'; inQuote = true; } html += `<p>${inline(m[1])}</p>`; continue; }
    if((m = line.match(/^[-*]\s+(.*)/))){ closeQuote(); if(inList !== 'ul'){ closeList(); html += '<ul>'; inList = 'ul'; } html += `<li>${inline(m[1])}</li>`; continue; }
    if((m = line.match(/^\d+\.\s+(.*)/))){ closeQuote(); if(inList !== 'ol'){ closeList(); html += '<ol>'; inList = 'ol'; } html += `<li>${inline(m[1])}</li>`; continue; }
    closeList(); closeQuote();
    html += `<p>${inline(line)}</p>`;
  }
  closeList(); closeQuote();
  return html;
}

async function generateBlog(){
  const topic = document.getElementById('topic').value.trim();
  const outputArea = document.getElementById('outputArea');
  const resultCard = document.getElementById('resultCard');
  const btn = document.getElementById('genBtn');
  const btnText = document.getElementById('genBtnText');

  if(!topic){
    resultCard.classList.add('visible');
    outputArea.innerHTML = `<div class="error-note">Add a topic before generating.</div>`;
    return;
  }

  btn.disabled = true;
  btnText.textContent = 'Generating';
  resultCard.classList.add('visible');
  outputArea.innerHTML = `
    <div class="loading-state">
      <div class="orb"></div>
      <div class="loading-text">drafting your post<span class="dots"></span></div>
    </div>`;

  try{
    const response = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic, angle: angleValue, tone: toneValue })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || `Request failed (${response.status})`);
    }

    lastDraft = data.draft;
    const words = data.word_count || lastDraft.split(/\s+/).filter(Boolean).length;

    outputArea.innerHTML = `
      <div class="result-meta">
        <span class="tag">${escapeHtml(toneValue)}</span>
        <span class="wc">${words} words</span>
      </div>
      <div class="draft">${renderMarkdown(lastDraft)}</div>
      <div class="toolbar">
        <button class="tool-btn" onclick="copyDraft()">Copy text</button>
        <button class="tool-btn" onclick="downloadDraft()">Download .md</button>
      </div>`;

  } catch(err){
    outputArea.innerHTML = `<div class="error-note">Something went wrong: ${escapeHtml(err.message)}. Try again.</div>`;
  } finally {
    btn.disabled = false;
    btnText.textContent = 'Generate post';
  }
}

function copyDraft(){
  if(!lastDraft) return;
  navigator.clipboard.writeText(lastDraft);
}

function downloadDraft(){
  if(!lastDraft) return;
  const blob = new Blob([lastDraft], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'blog-draft.md';
  a.click();
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
