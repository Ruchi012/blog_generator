<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compose</title>
<style>
  body {
    background-color: #FDF0DC;
    font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
    margin: 0;
    padding: 30px 20px 60px 20px;
  }

  .wrap {
    max-width: 800px;
    margin: 0 auto;
  }

  .block {
    border-radius: 20px;
    padding: 30px 36px;
    margin-bottom: 22px;
  }

  /* Header block */
  .header-block {
    background-color: #7B5FE0;
    text-align: center;
    color: white;
  }
  .header-block h1 {
    font-size: 42px;
    margin: 0 0 10px 0;
    font-weight: 800;
  }
  .header-block p {
    margin: 0;
    font-size: 16px;
    opacity: 0.95;
  }

  /* Section blocks */
  .pink-block   { background-color: #FCE0EC; }
  .yellow-block { background-color: #FCF0A0; }
  .blue-block   { background-color: #D6EEFB; }

  .block h2 {
    margin: 0 0 20px 0;
    font-size: 22px;
    color: #2b2b2b;
  }

  label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    color: #333333;
    margin-bottom: 8px;
  }

  textarea, select {
    width: 100%;
    background-color: #ffffff;
    border: 2px solid #1a1a1a;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    box-sizing: border-box;
  }
  textarea {
    resize: vertical;
    min-height: 60px;
  }

  .col-2 {
    display: flex;
    gap: 20px;
    margin-bottom: 22px;
  }
  .col-2 > div {
    flex: 1;
  }
  @media (max-width: 600px) {
    .col-2 { flex-direction: column; }
  }

  .generate-btn {
    display: block;
    width: 100%;
    background-color: #FF6F5E;
    color: white;
    font-size: 18px;
    font-weight: bold;
    border: 2.5px solid #1a1a1a;
    border-radius: 999px;
    padding: 16px;
    cursor: pointer;
    box-shadow: 3px 4px 0 #1a1a1a;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .generate-btn:hover:not(:disabled) {
    background-color: #ff5b47;
  }
  .generate-btn:active:not(:disabled) {
    transform: translate(2px, 3px);
    box-shadow: 1px 1px 0 #1a1a1a;
  }
  .generate-btn:disabled {
    opacity: 0.7;
    cursor: default;
  }

  #outputBox {
    background-color: #ffffff;
    border: 2px solid #1a1a1a;
    border-radius: 12px;
    padding: 16px 18px;
    min-height: 90px;
    white-space: pre-wrap;
    font-size: 14.5px;
    color: #333333;
    max-height: 420px;
    overflow-y: auto;
  }
  #outputBox.empty {
    color: #6b6fa0;
    font-style: italic;
  }

  .word-count {
    text-align: right;
    font-size: 12.5px;
    color: #557;
    margin-top: 8px;
  }

  .toolbar {
    margin-top: 14px;
    display: flex;
    gap: 10px;
  }
  .tool-btn {
    background-color: #ffffff;
    border: 2px solid #1a1a1a;
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  .tool-btn:hover {
    background-color: #f0f0f0;
  }

  .error-text {
    color: #c0392b;
    font-weight: bold;
  }

  footer {
    text-align: center;
    font-size: 12px;
    color: #8a7a5c;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="block header-block">
    <h1>Compose</h1>
    <p>Type a topic, pick a vibe, get a blog post!</p>
  </div>

  <div class="block pink-block">
    <h2>What's it about?</h2>
    <label for="topic">Topic</label>
    <textarea id="topic" rows="3" placeholder="e.g. why I stopped using to-do list apps"></textarea>
  </div>

  <div class="block yellow-block">
    <h2>Pick a style</h2>
    <div class="col-2">
      <div>
        <label for="angle">Angle</label>
        <select id="angle">
          <option value="an explainer that unpacks a concept">Explainer</option>
          <option value="a practical how-to guide">How-to Guide</option>
          <option value="a personal essay or story">Personal Essay</option>
          <option value="an opinion piece or hot take">Opinion / Hot Take</option>
          <option value="an industry analysis">Industry Analysis</option>
        </select>
      </div>
      <div>
        <label for="tone">Voice</label>
        <select id="tone">
          <option value="warm and personal">Warm and Personal</option>
          <option value="sharp and analytical">Sharp and Analytical</option>
          <option value="playful and witty">Playful and Witty</option>
          <option value="authoritative and expert">Authoritative</option>
          <option value="conversational and grounded">Conversational</option>
        </select>
      </div>
    </div>
    <button class="generate-btn" id="genBtn" onclick="generateBlog()">Generate Blog Post</button>
  </div>

  <div class="block blue-block">
    <h2>&#128220; Your blog post</h2>
    <div id="outputBox" class="empty">Nothing here yet — fill in a topic and hit generate!</div>
    <div class="word-count" id="wordCount"></div>
    <div class="toolbar" id="toolbarArea"></div>
  </div>

  <footer>made with Flask + the Groq API</footer>

</div>

<script>
var lastDraft = "";

function generateBlog() {
  var topic = document.getElementById("topic").value.trim();
  var angle = document.getElementById("angle").value;
  var tone = document.getElementById("tone").value;
  var outputBox = document.getElementById("outputBox");
  var wordCount = document.getElementById("wordCount");
  var toolbarArea = document.getElementById("toolbarArea");
  var btn = document.getElementById("genBtn");

  toolbarArea.innerHTML = "";
  wordCount.innerHTML = "";

  if (topic === "") {
    outputBox.classList.remove("empty");
    outputBox.innerHTML = '<span class="error-text">Please type a topic first!</span>';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = "Generating...";
  outputBox.classList.remove("empty");
  outputBox.innerHTML = "loading, please wait...";

  fetch("/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ topic: topic, angle: angle, tone: tone })
  })
  .then(function(response) {
    return response.json().then(function(data) {
      return { ok: response.ok, data: data };
    });
  })
  .then(function(result) {
    btn.disabled = false;
    btn.innerHTML = "Generate Blog Post";

    if (!result.ok) {
      outputBox.innerHTML = '<span class="error-text">Error: ' + (result.data.error || "something went wrong") + '</span>';
      return;
    }

    lastDraft = result.data.draft;
    var words = result.data.word_count || lastDraft.split(" ").length;

    outputBox.innerHTML = lastDraft;
    wordCount.innerHTML = words + " words";

    toolbarArea.innerHTML =
      '<button class="tool-btn" onclick="copyDraft()">Copy</button>' +
      '<button class="tool-btn" onclick="downloadDraft()">Download</button>';
  })
  .catch(function(err) {
    btn.disabled = false;
    btn.innerHTML = "Generate Blog Post";
    outputBox.innerHTML = '<span class="error-text">Error: ' + err + '</span>';
  });
}

function copyDraft() {
  if (lastDraft === "") return;
  navigator.clipboard.writeText(lastDraft);
  alert("copied!");
}

function downloadDraft() {
  if (lastDraft === "") return;
  var blob = new Blob([lastDraft], { type: "text/plain" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "blog-post.txt";
  a.click();
}
</script>

</body>
</html>
